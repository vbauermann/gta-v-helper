<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GTA Helper</title>
  <link rel="stylesheet" href="styles/nexo.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand" id="brand">GTA Helper</div>
      <div class="spacer"></div>
      <span class="game-pill" id="game-pill"></span>
    </header>
    <div class="body">
      <aside class="sidebar" id="nav">
        <button class="nav-item" data-page="overview" data-icon="overview"><span class="label">Visão geral</span></button>
        <button class="nav-item" data-page="businesses" data-icon="businesses"><span class="label">Negócios</span><span class="badge hot"></span></button>
        <div class="nav-section">Golpes</div>
        <button class="nav-item" data-page="cayo" data-icon="cayo"><span class="label">Cayo Perico</span><span class="badge"></span></button>
        <button class="nav-item" data-page="casino" data-icon="casino"><span class="label">Diamond Casino</span></button>
        <button class="nav-item" data-page="payouts" data-icon="payouts"><span class="label">Tabela de payouts</span></button>
        <div class="nav-section">App</div>
        <button class="nav-item" data-page="settings" data-icon="settings"><span class="label">Ajustes</span></button>
        <div class="nav-fill"></div>
        <button class="watch-card" id="watch"></button>
      </aside>
      <main class="main" id="main">
        <section class="page" id="page"></section>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="../lib/production.js"></script>
  <script src="../lib/heists.js"></script>
  <script src="../lib/hotkeys.js"></script>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="pages/overview.js"></script>
  <script src="pages/businesses.js"></script>
  <script src="pages/cayo-map.js"></script>
  <script src="pages/cayo.js"></script>
  <script src="pages/fingerprint.js"></script>
  <script src="pages/casino.js"></script>
  <script src="pages/payouts.js"></script>
  <script src="pages/settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
