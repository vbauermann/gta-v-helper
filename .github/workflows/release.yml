# Publishes the Windows installer as a GitHub release whenever package.json on main carries a
# version that has no release yet (or on demand from the Actions tab). Installed apps find it
# there and update themselves (electron-updater reads latest.yml from the release).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip versions already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm test
      - name: Build and publish the installer
        if: steps.version.outputs.new == 'true'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
