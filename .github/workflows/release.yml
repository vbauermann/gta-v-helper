# Publishes the Windows installer as a GitHub release whenever package.json on main carries a
# version that has no release yet (or on demand from the Actions tab). Installed apps find it
# there and update themselves (electron-updater reads latest.yml from the release).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip versions already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          # A release counts as done once it carries latest.yml, the file installed apps read.
          if gh release view "$v" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm test
      - name: Build the installer
        if: steps.version.outputs.new == 'true'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          files=(release/GTA-Helper-Setup-*.exe release/GTA-Helper-Setup-*.exe.blockmap release/latest.yml)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes=$(node -e "const r=require('./data/release-notes.json').versions[0]; console.log('## '+r.title+'\n\n'+r.items.map(i=>'- '+i).join('\n'))")
            gh release create "$TAG" "${files[@]}" --title "GTA Helper ${TAG#v}" --notes "$notes" --target "$GITHUB_SHA"
          fi
